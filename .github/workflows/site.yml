name: site

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: build
        run: npm run build
      - name: check (parity, links, stale and orphan pages)
        run: npm run check
      - name: download gate selftest
        run: npm test
